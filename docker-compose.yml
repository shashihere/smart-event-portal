version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: eventportal-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smart_events
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: eventportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
